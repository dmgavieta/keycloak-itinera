services:
  - type: web
    name: keycloak
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: start-dev
    envVars:
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        value: admin@1234
      - key: KC_DB
        value: postgres
      - key: KC_DB_SCHEMA
        value: public
      - key: KC_DB_USERNAME
        value: keycloak
      - key: KC_DB_PASSWORD
        value: password
      - key: KC_DB_URL
        value: jdbc:postgresql://postgres:5432/keycloak
    healthCheckPath: /
    disk:
      sizeGB: 1
    plan: free

  - type: postgres
    name: keycloak-postgres
    plan: free
    disk:
      sizeGB: 1
    envVars:
      - key: POSTGRES_DB
        value: keycloak
      - key: POSTGRES_USER
        value: keycloak
      - key: POSTGRES_PASSWORD
        value: password
